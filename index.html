<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04121f">
<title>Neon Strike Rivals</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#03101c;color:#dff6ff;font-family:Impact,"Arial Narrow",system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;justify-content:safe center;gap:14px;padding:16px;
  background:radial-gradient(ellipse at 20% 0%,#0b3b57 0,#041626 55%,#02080f 100%);overflow:auto}
.screen.active{display:flex}
.hidden{display:none!important}
h2{margin:0;letter-spacing:3px;color:#5be7ff;font-style:italic;text-shadow:0 0 12px #00c8ff88}
h3{margin:0 0 6px;letter-spacing:2px;color:#7dffd9}
.logo{font-size:min(11vw,64px);font-style:italic;font-weight:900;line-height:.9;text-align:center;color:#6fe9ff;text-shadow:0 0 22px #00b7ff}
.logo span{display:block;color:#fff;transform:skewX(-8deg)}
.tag{font-size:12px;letter-spacing:2px;color:#9fd8ea;text-align:center;margin:0}
.foot{font-style:italic;color:#4aa7c4;opacity:.8}
.menu-list{display:flex;flex-direction:column;gap:8px;width:min(80vw,320px)}
button,select{font:inherit;color:#dff6ff}
button{background:linear-gradient(#0d3550,#07202f);border:1px solid #1fa7d0;padding:12px 16px;letter-spacing:2px;border-radius:4px;box-shadow:0 0 10px #00b7ff33 inset;cursor:pointer}
button:active{transform:scale(.97);background:#0f5a7d}
button.primary{background:linear-gradient(#10a6d6,#0a6c93);border-color:#7de8ff;box-shadow:0 0 16px #00d4ff77}
.back{align-self:flex-start;opacity:.9}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(94vw,720px)}
.card{display:flex;flex-direction:column;gap:4px;padding:18px 10px;text-align:center}
.card small{opacity:.75;letter-spacing:0;font-family:system-ui,sans-serif}
.panel{background:#07202fcc;border:1px solid #1d7fa0;padding:14px;border-radius:6px;display:flex;flex-direction:column;gap:10px;width:min(94vw,520px)}
.panel p,.panel ul{margin:0;font-family:system-ui,sans-serif;font-size:13px;opacity:.85}
.panel ul{padding-left:18px}
.flowp{border-color:#26d8ff}.awakep{border-color:#3dffa8}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;letter-spacing:1px}
select{background:#0a2a3d;border:1px solid #1fa7d0;padding:8px;border-radius:4px}
